<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BM Booking App Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F9F7F2;
      --surface: #FFFFFF;
      --accent: #1A1A1A;
      --accent-secondary: #3E5C76;
      --text-primary: #101828;
      --text-body: #344054;
      --text-secondary: #667085;
      --text-muted: #98A2B3;
      --border: #E4E7EC;
      --success: #027A48;
      --radius-lg: 16px;
      --radius-sm: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-body);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100dvh;
    }
    .shell {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
    }
    .toolbar h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }
    .main {
      flex: 1;
      padding: 20px 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
    }
    .field { margin-bottom: 14px; }
    .field:last-of-type { margin-bottom: 18px; }
    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .input-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .input-wrap:focus-within {
      border-color: var(--accent-secondary);
      box-shadow: 0 0 0 3px rgba(62, 92, 118, 0.1);
    }
    .input-wrap input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 11px 12px;
      font-family: var(--font);
      font-size: 16px;
      color: var(--text-primary);
      outline: none;
    }
    .input-wrap input[readonly] { color: var(--text-secondary); }
    .btn-liquid {
      width: 100%;
      padding: 14px 20px;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.45, 0.64, 1), box-shadow 0.3s;
      box-shadow: 0 4px 12px rgba(26, 26, 26, 0.15);
    }
    .btn-liquid:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(26, 26, 26, 0.2);
    }
    .btn-liquid:disabled { opacity: 0.55; cursor: not-allowed; }
    .error {
      display: none;
      margin-top: 12px;
      padding: 14px;
      background: #FEF3F2;
      border: 1px solid #FECDCA;
      border-radius: var(--radius-sm);
      color: #B42318;
      font-size: 14px;
    }
    .error.show { display: block; }
    .error strong { display: block; margin-bottom: 4px; }
    .success-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .success-screen.show { display: flex; }
    .success-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .success-ring svg {
      width: 32px;
      height: 32px;
      stroke: var(--success);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .success-screen h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 32px;
    }
    .success-screen .btn-liquid { max-width: 300px; }
    .gone { display: none !important; }
  </style>
</head>
<body>
  <div class="shell" id="mainShell">
    <header class="toolbar">
      <h1>BM Booking App Payment</h1>
    </header>
    <main class="main">
      <div class="card">
        <form id="paymentForm">
          <div class="field">
            <label class="field-label" for="title">Service</label>
            <div class="input-wrap">
              <input type="text" id="title" name="title" value="BM Booking appointment" required>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="total_amount">Amount (ETB)</label>
            <div class="input-wrap">
              <input type="number" id="total_amount" name="total_amount" value="50.00" step="0.01" min="1" required>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="trans_currency">Currency</label>
            <div class="input-wrap">
              <input type="text" id="trans_currency" name="trans_currency" value="ETB" readonly>
            </div>
          </div>
          <button type="submit" class="btn-liquid" id="submitBtn"><span>Create payment order</span></button>
        </form>
      </div>
      <div id="errorBox" class="error"></div>
    </main>
  </div>

  <div class="success-screen" id="successScreen">
    <div class="success-ring">
      <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h2>Order Created Successfully!</h2>
    <button type="button" class="btn-liquid" id="openPaymentBtn"><span>Open payment page</span></button>
  </div>

  <script>
    let paymentUrl = '';
    let baseUrl = window.location.origin;

    // Use server IP from env (not localhost) when configured
    fetch(window.location.origin + '/callback-status')
      .then((r) => r.json())
      .then((data) => {
        if (data.baseUrl) baseUrl = data.baseUrl;
      })
      .catch(() => {});

    document.getElementById('openPaymentBtn').addEventListener('click', () => {
      if (paymentUrl) window.open(paymentUrl, '_blank');
    });

    // Prefill amount only from BM Booking mobile (?amount=)
    const params = new URLSearchParams(window.location.search);
    if (params.get('amount')) document.getElementById('total_amount').value = params.get('amount');
    // Telegram Mini App opens this page with ?src=tg — mark the redirect so
    // success.html knows to stay browser-safe (no app deep link).
    const fromTelegram = params.get('src') === 'tg';

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('errorBox');
      btn.disabled = true;
      btn.querySelector('span').textContent = 'Creating order…';
      err.classList.remove('show');

      // Telegram WebView blocks plain-http pages and custom schemes, so use our
      // HTTPS backend page for the redirect when opened from the Telegram app.
      // For browsers/web app, pass the opener's origin so success.html's
      // "Return to BM Booking App" button reloads the SAME app (which keeps the
      // pending booking in sessionStorage and auto-creates the appointment).
      let refOrigin = '';
      try { refOrigin = new URL(document.referrer).origin; } catch (e) { /* ignore */ }
      const returnTo = (refOrigin || 'https://bmbookingtelegrambot.possibletechplc.com') + '/patient/appointments';
      const src = params.get('src') === 'tg' ? 'tg' : 'app';
      const redirectUrl = fromTelegram
        ? 'https://bmbookingapi.possibletechplc.com/api/payments/success-redirect?from=tg'
        : baseUrl + '/success.html?src=' + src + '&returnTo=' + encodeURIComponent(returnTo);

      const fd = new FormData(e.target);
      const body = {
        refNo: 'ORD' + Date.now(),
        title: fd.get('title'),
        total_amount: fd.get('total_amount'),
        trans_currency: fd.get('trans_currency'),
        notify_url: baseUrl + '/notify.html',
        redirect_url: redirectUrl
      };

      try {
        const res = await fetch(window.location.origin + '/create/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          let msg;
          try { msg = (await res.json()).error; } catch { msg = await res.text(); }
          throw new Error(msg || 'Request failed');
        }
        paymentUrl = (await res.text()).trim();
        document.getElementById('mainShell').classList.add('gone');
        document.getElementById('successScreen').classList.add('show');
      } catch (error) {
        let msg = error.message;
        if (error.name === 'TypeError' && msg.includes('fetch')) {
          msg = 'Cannot reach server. Start Telebirr H5 on port 8080.';
        }
        err.innerHTML = '<strong>Could not create order</strong>' + msg;
        err.classList.add('show');
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Create payment order';
      }
    });
  </script>
</body>
</html>

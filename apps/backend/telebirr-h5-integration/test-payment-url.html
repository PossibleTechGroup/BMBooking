<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Payment URL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .url-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            word-break: break-all;
        }
        button {
            background: #2E8B57;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #25724a;
        }
        a {
            color: #2E8B57;
            text-decoration: none;
            word-break: break-all;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Test Payment URL Opening</h1>
    
    <div class="url-box">
        <strong>Payment URL:</strong><br>
        <span id="paymentUrl">Loading...</span>
    </div>
    
    <div>
        <h3>Ways to open payment URL:</h3>
        <button onclick="openInNewTab()">Open in New Tab (window.open)</button>
        <button onclick="openInSameWindow()">Open in Same Window (location.href)</button>
        <button onclick="copyUrl()">Copy URL</button>
    </div>
    
    <div style="margin-top: 20px;">
        <h3>Anchor Tag Method:</h3>
        <a id="anchorLink" href="#" target="_blank">Click here to pay</a>
    </div>
    
    <script>
        // Get payment URL from query parameter or set a test URL
        const urlParams = new URLSearchParams(window.location.search);
        let paymentUrl = urlParams.get('url');
        
        if (!paymentUrl) {
            // Test URL - replace with actual URL from API
            paymentUrl = 'https://developerportal.ethiotelebirr.et:38443/payment/web/paygate?appid=1311232930739201&merch_code=276503&nonce_str=TEST&prepay_id=TEST&timestamp=1234567890&sign=TEST&sign_type=SHA256WithRSA&version=1.0&trade_type=Checkout';
        }
        
        // Display URL
        document.getElementById('paymentUrl').textContent = paymentUrl;
        document.getElementById('anchorLink').href = paymentUrl;
        
        function openInNewTab() {
            window.open(paymentUrl, '_blank');
        }
        
        function openInSameWindow() {
            window.location.href = paymentUrl;
        }
        
        function copyUrl() {
            navigator.clipboard.writeText(paymentUrl).then(() => {
                alert('URL copied to clipboard!');
            }).catch(() => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = paymentUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('URL copied to clipboard!');
            });
        }
    </script>
</body>
</html>

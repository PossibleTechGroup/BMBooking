<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Top Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: #2E8B57;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .content {
            padding: 30px;
        }
        .driver-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .driver-info p {
            margin: 5px 0;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 18px;
            transition: border-color 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #2E8B57;
        }
        .btn-pay {
            width: 100%;
            background: #2E8B57;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-pay:hover {
            background: #25724a;
        }
        .btn-pay:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.info {
            background: #cce7ff;
            color: #004085;
            border: 1px solid #99d3ff;
        }
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .quick-amount {
            padding: 12px;
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .quick-amount:hover {
            background: #e9ecef;
            border-color: #2E8B57;
        }
        .quick-amount.selected {
            background: #2E8B57;
            color: white;
            border-color: #2E8B57;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Top Up Balance</h1>
            <p>Add money to your driver account</p>
        </div>
        
        <div class="content">
            <div class="driver-info" id="driverInfo">
                <p><strong>Driver ID:</strong> <span id="driverIdDisplay">Loading...</span></p>
                <p><strong>Status:</strong> <span id="statusDisplay">Checking...</span></p>
            </div>

            <div class="form-group">
                <label>Quick Select</label>
                <div class="quick-amounts">
                    <div class="quick-amount" onclick="selectAmount(50)">50 ETB</div>
                    <div class="quick-amount" onclick="selectAmount(100)">100 ETB</div>
                    <div class="quick-amount" onclick="selectAmount(200)">200 ETB</div>
                    <div class="quick-amount" onclick="selectAmount(500)">500 ETB</div>
                    <div class="quick-amount" onclick="selectAmount(1000)">1000 ETB</div>
                    <div class="quick-amount" onclick="selectAmount(2000)">2000 ETB</div>
                </div>
            </div>

            <div class="form-group">
                <label for="amount">Or Enter Custom Amount (ETB)</label>
                <input type="number" id="amount" placeholder="Enter amount" value="50" min="1" step="1">
            </div>

            <button class="btn-pay" id="payBtn" onclick="initiatePayment()">
                🔒 Pay with Telebirr
            </button>

            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const driverId = urlParams.get('driverId');
        const token = urlParams.get('token');
        const baseApiUrl = 'https://purchase-elementary-paintball-game.trycloudflare.com/api/v1';

        // Check if driver info is provided
        if (!driverId || !token) {
            showMessage('error', '❌ Missing driver information. Please open from the app.');
            document.getElementById('payBtn').disabled = true;
            document.getElementById('driverIdDisplay').textContent = 'N/A';
            document.getElementById('statusDisplay').textContent = 'Invalid';
        } else {
            document.getElementById('driverIdDisplay').textContent = driverId.substring(0, 8) + '...';
            document.getElementById('statusDisplay').textContent = '✅ Authenticated';
        }

        function selectAmount(amount) {
            // Remove selected class from all
            document.querySelectorAll('.quick-amount').forEach(el => {
                el.classList.remove('selected');
            });
            // Add selected class to clicked one
            event.target.classList.add('selected');
            // Set input value
            document.getElementById('amount').value = amount;
        }

        async function initiatePayment() {
            const amount = parseFloat(document.getElementById('amount').value);
            const payBtn = document.getElementById('payBtn');
            const messageDiv = document.getElementById('message');

            // Validation
            if (!amount || amount < 1) {
                showMessage('error', '❌ Please enter an amount of at least 1 ETB');
                return;
            }

            try {
                // Disable button and show loading
                payBtn.disabled = true;
                payBtn.textContent = '⏳ Creating payment...';
                showMessage('info', '🔄 Creating payment order...');

                // Call backend API
                const redirectUrl = urlParams.get('redirect_url');
                const response = await fetch(`${baseApiUrl}/drivers/topup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ amount, redirectUrl })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to create payment');
                }

                const data = await response.json();
                const paymentUrl = data.paymentUrl;

                console.log('✅ Payment URL received:', paymentUrl);

                // Show success message
                showMessage('success', '✅ Payment created! Opening Telebirr...');

                // Navigate current page to payment URL so Flutter WebView
                // intercepts the riderapp:// deep link on redirect
                setTimeout(() => {
                    window.location.href = paymentUrl;
                }, 1000);

            } catch (error) {
                console.error('❌ Error:', error);
                showMessage('error', `❌ Error: ${error.message}`);
                payBtn.disabled = false;
                payBtn.textContent = '🔒 Pay with Telebirr';
            }
        }

        function showMessage(type, text) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
